# nginx.conf - non-root friendly config.
# Serves the static site on 8080 and exposes /healthz.
# __BUILD_SHA__ is substituted at image build time.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    access_log          /dev/stdout;
    sendfile            on;
    keepalive_timeout   65;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Expose the build identifier on every response.
        add_header X-Build-SHA "__BUILD_SHA__" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Lightweight health endpoint used by HEALTHCHECK, CI, and Consul.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }
    }
}
