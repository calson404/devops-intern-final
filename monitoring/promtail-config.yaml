# promtail-config.yaml - scrapes Docker container logs into Loki.
# Discovers containers via the Docker socket and applies relabels
# so Loki queries can filter by job, container, service, alloc id.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name -> 'container' label (strip leading '/').
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Compose service label -> 'service'.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Nomad sets this label on allocations it launches.
      - source_labels: ['__meta_docker_container_label_com_hashicorp_nomad_alloc_id']
        target_label: 'nomad_alloc_id'

      # Static job name.
      - target_label: 'job'
        replacement: 'docker'

      # stdout vs stderr.
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
